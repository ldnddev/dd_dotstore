# Publish docs/index.html as https://ldnddev.github.io/dd_dotstore/
name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/index.html"
      - "docs/images/**"
      - "docs/.nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stage tutorial site
        run: |
          mkdir -p _site/images
          cp docs/index.html docs/.nojekyll _site/
          cp docs/images/*.png _site/images/
          test -f _site/index.html
          test -f _site/images/01-main.png

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
