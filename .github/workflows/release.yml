name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v1.5.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "invalid tag: $TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/${TARGET}/release/dd_dotstore"
          test -x "$bin"
          stage="$(mktemp -d)"
          cp "$bin" "$stage/dd_dotstore"
          cp dd_dotstore_theme.yml "$stage/dd_dotstore_theme.yml"
          chmod 0755 "$stage/dd_dotstore"
          archive="dd_dotstore-${TAG}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "$stage" dd_dotstore dd_dotstore_theme.yml
          sha256sum "$archive" > "${archive}.sha256"
          tar -tzf "$archive"
          ls -l "$archive" "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dd_dotstore-*.tar.gz
            dd_dotstore-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/dd_dotstore-*.tar.gz dist/dd_dotstore-*.tar.gz.sha256)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi
          cat dist/*.sha256 > dist/SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" dist/SHA256SUMS --clobber
          else
            notes="RELEASE_NOTES.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" "${assets[@]}" dist/SHA256SUMS \
                --title "dd_dotstore ${TAG}" \
                --notes-file "$notes" \
                --verify-tag
            else
              gh release create "$TAG" "${assets[@]}" dist/SHA256SUMS \
                --title "dd_dotstore ${TAG}" \
                --generate-notes \
                --verify-tag
            fi
          fi
