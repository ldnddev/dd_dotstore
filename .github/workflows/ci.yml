name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Repo default token is contents:write. This job runs PR code via cargo test.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test
      - name: install.sh syntax
        run: bash -n install.sh
