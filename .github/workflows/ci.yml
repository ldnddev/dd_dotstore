name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Repo default token is contents:write. This job runs PR code via cargo test.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test
      - name: install.sh syntax
        run: bash -n install.sh
      - name: install.sh tarball checks
        run: bash tests/install_tarball.sh
