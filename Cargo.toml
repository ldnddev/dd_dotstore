[package]
name = "dd_dotstore"
version = "1.6.2"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["crates/ldnddev_theme"]
resolver = "2"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ldnddev_theme = { path = "crates/ldnddev_theme" }

[profile.release]
opt-level = "z" # smaller than "s" on this crate (~1014K vs ~1054K, x86_64 gnu)
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
