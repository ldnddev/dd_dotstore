[package]
name = "dd_dotstore"
version = "1.6.2"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["crates/ldnddev_theme"]
resolver = "2"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ldnddev_theme = { path = "crates/ldnddev_theme" }
